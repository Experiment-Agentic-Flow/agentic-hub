name: Knowledge Ingestion

# Receives a lightweight repository_dispatch from a target repo's own push-triggered workflow (e.g.
# mepworkspace/.github/workflows/knowledge-ingestion.yml). That payload carries no credentials at all -
# just which repo/commit range to look at - so Gemini and Pinecone secrets never have to exist
# outside this repo. The actual clone, Gemini CLI analysis, and Pinecone writes all happen here.
on:
  repository_dispatch:
    types: [knowledge-ingest]

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout agentic-hub
        uses: actions/checkout@v4

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.after }}
          token: ${{ secrets.ORG_GITHUB_PAT }}
          path: target-repo
          # Full history so a diff against an older last-ingested SHA (manual dispatch / a missed
          # push) is possible, not just against the immediately preceding commit.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Run incremental knowledge ingestion
        run: npm run ingest:push
        env:
          REPO: ${{ github.event.client_payload.repo }}
          REPO_TYPE: ${{ github.event.client_payload.repo_type }}
          REPO_DIR: ${{ github.workspace }}/target-repo
          EVENT_NAME: ${{ github.event.client_payload.event_name }}
          BEFORE_SHA: ${{ github.event.client_payload.before }}
          AFTER_SHA: ${{ github.event.client_payload.after }}
          FORCE_FULL: ${{ github.event.client_payload.force_full }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_SUMMARY_MODEL: ${{ vars.GEMINI_SUMMARY_MODEL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ vars.PINECONE_INDEX }}
          PINECONE_EMBEDDING_MODEL: ${{ vars.PINECONE_EMBEDDING_MODEL }}
          KNOWLEDGE_INGEST_CONCURRENCY: ${{ vars.KNOWLEDGE_INGEST_CONCURRENCY }}

      # data/repo-directory.json is a plain-JSON mirror of the same summaries just written to
      # Pinecone above (see shared/repoDirectory.js) - committed straight back to this repo so
      # agent-logic/repoDirectoryLookup.js always reads the latest version on the next ticket.
      - name: Commit updated repo directory
        run: |
          git config user.name "agent-hub-bot"
          git config user.email "agent-hub-bot@users.noreply.github.com"
          if git diff --quiet -- data/repo-directory.json; then
            echo "No repo-directory.json changes to commit."
          else
            git add data/repo-directory.json
            git commit -m "chore: update repo-directory.json (${{ github.event.client_payload.repo }})"
            git push
          fi
