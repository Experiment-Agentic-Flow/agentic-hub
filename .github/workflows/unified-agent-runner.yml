name: Unified Agent Runner

on:
  repository_dispatch:
    types: [jira-ticket]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-hub
        uses: actions/checkout@v4
        with:
          path: agent-hub

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agent-hub/package-lock.json

      - name: Install agent-hub dependencies
        working-directory: agent-hub
        run: npm ci

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      # n8n only ever sends the ticket key - the ticket type (bugfix/general/not automated) is
      # classified entirely within agent-hub, from the Jira issue type. This step fetches the
      # ticket's summary/description and resolves its type for later steps to use.
      - name: Fetch ticket details
        id: fetch-ticket
        working-directory: agent-hub
        run: node agent-logic/fetchTicket.js
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_API_VERSION: ${{ vars.JIRA_API_VERSION }}
          TICKET_KEY: ${{ github.event.client_payload.ticket_key }}

      # No checkout step here either: bugfix-agent.js / general-agent.js gather candidate
      # repo(s) themselves entirely within GitHub Actions - via the Jira parent ticket for bugfix,
      # or a vector-DB search for anything else (Technical Debt, Story, Task, ...) - clone each
      # candidate into WORKSPACE_DIR, and (if more than one came back) let the coding agent inspect
      # the real checked-out code to decide which one to actually modify.
      - name: Run bugfix agent
        if: steps.fetch-ticket.outputs.ticket_type == 'bugfix-ticket'
        working-directory: agent-hub
        run: node agent-logic/bugfix-agent.js
        env:
          CODING_PROVIDER: ${{ vars.CODING_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ vars.PINECONE_INDEX }}
          PINECONE_EMBEDDING_MODEL: ${{ vars.PINECONE_EMBEDDING_MODEL }}
          ORG_GITHUB_PAT: ${{ secrets.ORG_GITHUB_PAT }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_API_VERSION: ${{ vars.JIRA_API_VERSION }}
          TICKET_KEY: ${{ github.event.client_payload.ticket_key }}
          TICKET_DESCRIPTION: ${{ steps.fetch-ticket.outputs.description }}
          WORKSPACE_DIR: ${{ github.workspace }}/workspace

      - name: Run agent (non-bugfix tickets)
        if: steps.fetch-ticket.outputs.ticket_type == 'general-ticket'
        working-directory: agent-hub
        run: node agent-logic/general-agent.js
        env:
          CODING_PROVIDER: ${{ vars.CODING_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ vars.PINECONE_INDEX }}
          PINECONE_EMBEDDING_MODEL: ${{ vars.PINECONE_EMBEDDING_MODEL }}
          ORG_GITHUB_PAT: ${{ secrets.ORG_GITHUB_PAT }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_API_VERSION: ${{ vars.JIRA_API_VERSION }}
          TICKET_KEY: ${{ github.event.client_payload.ticket_key }}
          TICKET_DESCRIPTION: ${{ steps.fetch-ticket.outputs.description }}
          WORKSPACE_DIR: ${{ github.workspace }}/workspace
